<div class="col">
  <div class="card h-100 product-card shadow-sm">
    <div class="product-img-wrap">
      <img src="{{ product.image_url or 'https://placehold.co/400x300?text=Product' }}" alt="{{ product.name }}" class="product-img" />
    </div>
    <div class="card-body d-flex flex-column">
      <h5 class="card-title mb-1">{{ product.name }}</h5>
      <p class="text-muted small mb-2">{{ product.description[:80] }}{% if product.description|length > 80 %}…{% endif %}</p>
      <div class="mt-auto d-flex justify-content-between align-items-center">
        <span class="fw-bold text-primary fs-5">${{ '%.2f'|format(product.price) }}</span>
        <a href="{{ url_for('shop.product_detail', product_id=product.id) }}" class="btn btn-outline-primary btn-sm">View</a>
      </div>
    </div>
  </div>
</div>
