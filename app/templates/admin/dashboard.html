{% extends "base.html" %}
{% block title %}Admin — Dashboard{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0"><i class="bi bi-shield-lock"></i> Admin dashboard</h1>
  <span class="text-muted small">Logged in as {{ current_user.email }}</span>
</div>
<div class="row g-4">
  <div class="col-md-6">
    <a href="{{ url_for('admin.products') }}" class="text-decoration-none">
      <div class="card shadow-sm h-100 border-0 admin-tile">
        <div class="card-body">
          <i class="bi bi-box-seam fs-1 text-primary"></i>
          <h5 class="mt-2">Products</h5>
          <p class="display-6 mb-0">{{ product_count }}</p>
          <small class="text-muted">Manage catalog</small>
        </div>
      </div>
    </a>
  </div>
  <div class="col-md-6">
    <a href="{{ url_for('admin.orders') }}" class="text-decoration-none">
      <div class="card shadow-sm h-100 border-0 admin-tile">
        <div class="card-body">
          <i class="bi bi-receipt fs-1 text-success"></i>
          <h5 class="mt-2">Orders</h5>
          <p class="display-6 mb-0">{{ order_count }}</p>
          <small class="text-muted">View customer orders</small>
        </div>
      </div>
    </a>
  </div>
</div>
{% endblock %}
