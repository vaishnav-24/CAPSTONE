trigger:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.11'
  azureSubscription: '<YOUR-AZURE-SERVICE-CONNECTION>'
  qaAppName: '<YOUR-QA-APP-SERVICE-NAME>'
  prodAppName: '<YOUR-PROD-APP-SERVICE-NAME>'

stages:
# ---------- BUILD ----------
- stage: Build
  displayName: Build & Test
  jobs:
    - job: BuildJob
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '$(pythonVersion)'

        - script: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          displayName: 'Install dependencies'

        - script: |
            source venv/bin/activate
            pytest -q || echo "No tests yet"
          displayName: 'Run tests'

        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: zip
            archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
            replaceExistingArchive: true
            exclude: |
              venv/**
              .venv/**
              **/__pycache__/**
              .git/**

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'drop'

# ---------- DEPLOY QA ----------
- stage: DeployQA
  displayName: Deploy to QA
  dependsOn: Build
  condition: succeeded()
  jobs:
    - deployment: DeployQA
      environment: 'QA'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(qaAppName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 run:app'

# ---------- DEPLOY PROD (with approval gate) ----------
- stage: DeployProd
  displayName: Deploy to Production
  dependsOn: DeployQA
  condition: succeeded()
  jobs:
    - deployment: DeployProd
      environment: 'Production'   # Configure manual approval on this environment in Azure DevOps
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(prodAppName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 run:app'
