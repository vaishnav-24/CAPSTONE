trigger:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.11'
  azureSubscription: 'sc-capstone'
  qaAppName: 'ecommerce-qa-capstone'
  prodAppName: 'ecommerce-prod-capstone'
  minCoveragePct: '60'   # Fail the quality gate if test coverage drops below this %

stages:
# ---------- BUILD ----------
- stage: Build
  displayName: Build & Test
  jobs:
    - job: BuildJob
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '$(pythonVersion)'

        - script: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          displayName: 'Install dependencies'

        - script: |
            source venv/bin/activate
            pytest -q || echo "No tests yet"
          displayName: 'Run tests'

        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: zip
            archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
            replaceExistingArchive: true
            exclude: |
              venv/**
              .venv/**
              **/__pycache__/**
              .git/**

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'drop'

# ---------- DEPLOY QA ----------
- stage: DeployQA
  displayName: Deploy to QA
  dependsOn: QualityGate
  condition: succeeded()
  jobs:
    - deployment: DeployQA
      environment: 'QA'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(qaAppName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 run:app'

# ---------- QUALITY GATE ----------
# Blocks deployment if code quality, security, or test coverage checks fail.
- stage: QualityGate
  displayName: Quality Gate
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: QualityChecks
      displayName: Lint, Security & Coverage
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '$(pythonVersion)'

        - script: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install flake8 bandit pytest-cov
          displayName: 'Install quality tools'

        - script: |
            source venv/bin/activate
            echo "=== Running flake8 (lint) ==="
            flake8 app --count --max-line-length=120 --statistics
          displayName: 'Lint (flake8)'
          continueOnError: true   # Lint warnings reported but don't fail the gate by themselves

        - script: |
            source venv/bin/activate
            echo "=== Running bandit (security scan) ==="
            bandit -r app -ll
          displayName: 'Security scan (bandit)'
          continueOnError: true

        - script: |
            source venv/bin/activate
            echo "=== Running tests with coverage ==="
            pytest --cov=app --cov-report=xml --cov-report=html --junitxml=test-results.xml --cov-fail-under=$(minCoveragePct) || true
            # Run again strictly to enforce the threshold (fails the stage if below)
            pytest --cov=app --cov-fail-under=$(minCoveragePct)
          displayName: 'Tests + coverage (enforces $(minCoveragePct)% min)'

        - task: PublishTestResults@2
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: 'test-results.xml'
            failTaskOnFailedTests: true
          displayName: 'Publish test results'

        - task: PublishCodeCoverageResults@2
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
            pathToSources: '$(System.DefaultWorkingDirectory)/app'
          displayName: 'Publish coverage report'


# ---------- DEPLOY PROD (with approval gate) ----------
- stage: DeployProd
  displayName: Deploy to Production
  dependsOn: DeployQA
  condition: succeeded()
  jobs:
    - deployment: DeployProd
      environment: 'Production'   # Configure manual approval on this environment in Azure DevOps
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(prodAppName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 run:app'
