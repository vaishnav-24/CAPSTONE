trigger:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.11'
  azureSubscription: 'sc-capstone-azure'
  qaAppName: 'ecommerce-qa-capstone'
  prodAppName: 'ecommerce-prod-capstone'
  minCoveragePct: '0'

stages:
- stage: Build
  displayName: Build & Test
  jobs:
    - job: BuildJob
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '$(pythonVersion)'

        - script: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          displayName: 'Install dependencies'

        - script: |
            source venv/bin/activate
            pytest -q || echo "No tests yet"
          displayName: 'Run tests'

        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: zip
            archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
            replaceExistingArchive: true

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'drop'



- stage: DeployQA
  displayName: Deploy to QA
  dependsOn: QualityGate
  condition: succeeded()
  jobs:
    - deployment: DeployQA
      environment: 'QA'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: DownloadBuildArtifacts@1
                inputs:
                  buildType: 'current'
                  downloadType: 'single'
                  artifactName: 'drop'
                  downloadPath: '$(Pipeline.Workspace)'

              - task: AzureWebApp@1
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(qaAppName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 run:app'
- stage: QualityGate
  displayName: Quality Gate
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: QualityChecks
      displayName: Lint, Security & Coverage
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '$(pythonVersion)'

        - script: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install flake8 bandit pytest-cov
          displayName: 'Install quality tools'

        - script: |
            source venv/bin/activate
            echo "=== Running flake8 (lint) ==="
            flake8 app --count --max-line-length=120 --statistics || true
          displayName: 'Lint (flake8)'

        - script: |
            source venv/bin/activate
            echo "=== Running bandit (security scan) ==="
            bandit -r app -ll || true
          displayName: 'Security scan (bandit)'

        - script: |
            source venv/bin/activate
            echo "=== Running tests with coverage ==="
            pytest --cov=app --cov-report=xml --cov-report=html --junitxml=test-results.xml --cov-fail-under=$(minCoveragePct) || true
          displayName: 'Tests + coverage'

        - task: PublishTestResults@2
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: 'test-results.xml'
            failTaskOnFailedTests: false
          displayName: 'Publish test results'

        - task: PublishCodeCoverageResults@2
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
            pathToSources: '$(System.DefaultWorkingDirectory)/app'
          displayName: 'Publish coverage report'

- stage: DeployProd
  displayName: Deploy to Production
  dependsOn: DeployQA
  condition: succeeded()
  jobs:
    - deployment: DeployProd
      environment: 'Production'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: DownloadBuildArtifacts@1
                inputs:
                  buildType: 'current'
                  downloadType: 'single'
                  artifactName: 'drop'
                  downloadPath: '$(Pipeline.Workspace)'

              - task: AzureWebApp@1
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(prodAppName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 run:app'
